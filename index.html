        /* =========================================================
   INTERACTION FX: cursor, tilt, magnetic, ripple, pills
   ========================================================= */
        function initCursor() {
          if (!finePointer || reduceMotion) return;
          const dot = $("#cursor");
          document.body.classList.add("has-cursor");
          let x = -50,
            y = -50,
            tx = -50,
            ty = -50;
          addEventListener(
            "mousemove",
            (e) => {
              tx = e.clientX;
              ty = e.clientY;
              dot.style.opacity = 1;
            },
            { passive: true },
          );
          document.documentElement.addEventListener("mouseleave", () => {
            dot.style.opacity = 0;
          });
          (function loop() {
            x += (tx - x) * 0.28;
            y += (ty - y) * 0.28;
            dot.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`;
            requestAnimationFrame(loop);
          })();
          document.addEventListener("mouseover", (e) => {
            dot.classList.toggle(
              "active",
              !!e.target.closest(
                'a,button,[role="button"],input,textarea,label,.tilt,.pill,.tech,.project',
              ),
            );
          });
        }
        function initTilt() {
          if (!finePointer || reduceMotion) return;
          $$("[data-tilt]").forEach((el) => {
            const max = parseFloat(el.dataset.tilt) || 8;
            el.addEventListener("mousemove", (e) => {
              const r = el.getBoundingClientRect();
              const px = (e.clientX - r.left) / r.width - 0.5,
                py = (e.clientY - r.top) / r.height - 0.5;
              el.style.transform = `perspective(900px) rotateX(${(-py * max).toFixed(2)}deg) rotateY(${(px * max).toFixed(2)}deg) translateY(-6px)`;
            });
            el.addEventListener("mouseleave", () => {
              el.style.transform = "";
            });
          });
        }
        function initButtons() {
          $$(".btn").forEach((b) => {
            b.addEventListener("click", (e) => {
              const r = b.getBoundingClientRect(),
                size = Math.max(r.width, r.height) * 2;
              const s = document.createElement("span");
              s.className = "ripple";
              s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
              b.appendChild(s);
              setTimeout(() => s.remove(), 700);
            });
            if (
              finePointer &&
              !reduceMotion &&
              b.classList.contains("magnetic")
            ) {
              b.addEventListener("mousemove", (e) => {
                const r = b.getBoundingClientRect();
                const dx = e.clientX - (r.left + r.width / 2),
                  dy = e.clientY - (r.top + r.height / 2);
                b.style.transform = `translate(${(dx * 0.28).toFixed(1)}px,${(dy * 0.4).toFixed(1)}px)`;
              });
              b.addEventListener("mouseleave", () => {
                b.style.transform = "";
              });
            }
          });
        }
        function initPills() {
          if (reduceMotion) return;
          const box = $("#pills"),
            pills = $$(".pill", box);
          const reset = () =>
            pills.forEach((p) => {
              p.style.removeProperty("--tx");
              p.style.removeProperty("--ty");
              p.style.removeProperty("--rot");
              p.style.removeProperty("--s");
            });
          const rnd = (n) => (Math.random() * 2 - 1) * n;
          box.addEventListener("mouseover", (e) => {
            const hov = e.target.closest(".pill");
            if (!hov) return;
            pills.forEach((p) => {
              if (p === hov) {
                p.style.setProperty("--s", "1.08");
                p.style.setProperty("--tx", "0px");
                p.style.setProperty("--ty", "0px");
                p.style.setProperty("--rot", "0deg");
              } else {
                p.style.setProperty("--tx", rnd(9).toFixed(1) + "px");
                p.style.setProperty("--ty", rnd(9).toFixed(1) + "px");
                p.style.setProperty("--rot", rnd(5).toFixed(1) + "deg");
                p.style.setProperty("--s", "1");
              }
            });
          });
          box.addEventListener("mouseleave", reset);
        }

        /* =========================================================
   INIT
   ========================================================= */
        buildNav();
        renderSkills();
        renderProjects();
        renderContacts();
        $("#year").textContent = new Date().getFullYear();
        setTheme(state.theme);
        setLang(state.lang);

        $("#langBtn").addEventListener("click", () =>
          setLang(state.lang === "en" ? "ar" : "en"),
        );
        $("#themeBtn").addEventListener("click", () =>
          setTheme(state.theme === "dark" ? "light" : "dark"),
        );

        initNav();
        initParticles();
        initModal();
        initContact();
        initCursor();
        initTilt();
        initButtons();
        initPills();
        observe();
      })();
    </script>
  </body>
</html>
