<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bashar Mansour — Flutter Developer</title>
    <meta
      name="description"
      content="Portfolio of Bashar Mansour, Flutter Developer and Informatics Engineering graduate from Damascus University."
    />
    <meta name="theme-color" content="#0a3440" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a3440'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='28' text-anchor='middle' fill='%23afbabe'%3EBM%3C/text%3E%3C/svg%3E"
    />
    <noscript
      ><style>
        .reveal,
        .load,
        .project {
          opacity: 1 !important;
          transform: none !important;
          animation: none !important;
        }
        .entrance {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >

    <style>
      /* =========================================================
   DESIGN TOKENS
   Dark mode uses the strict palette. Light mode re-maps the
   same palette (navy/teal become text + accent, surfaces go white).
   ========================================================= */
      :root {
        --primary: #0a3440;
        --secondary: #23374f;
        --accent-base: #afbabe;
        --success: #4ade80;

        --bg: #0a3440;
        --bg-alt: rgba(35, 55, 79, 0.35);
        --surface: #23374f;
        --surface-soft: rgba(35, 55, 79, 0.62);
        --accent-c: #afbabe;
        --accent-rgb: 175, 186, 190;
        --text: #ffffff;
        --text-2: rgba(175, 186, 190, 0.8);
        --on-accent: #0a3440;
        --nav-bg: rgba(10, 52, 64, 0.55);
        --drawer-bg: rgba(10, 52, 64, 0.94);
        --border: rgba(175, 186, 190, 0.25);
        --glow: rgba(175, 186, 190, 0.38);
        --shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.45);

        --radius: 16px;
        --radius-modal: 24px;
        --ease: 0.3s ease;
        --ease-d: cubic-bezier(0.22, 1, 0.36, 1);
        --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        --dir: 1;
        --nav-h: 72px;
        --font:
          "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue",
          Tahoma, "Noto Sans Arabic", Arial, sans-serif;
      }
      [data-theme="light"] {
        --bg: #eef2f3;
        --bg-alt: #e2e9eb;
        --surface: #ffffff;
        --surface-soft: rgba(255, 255, 255, 0.8);
        --accent-c: #23374f;
        --accent-rgb: 35, 55, 79;
        --text: #0a3440;
        --text-2: rgba(10, 52, 64, 0.74);
        --on-accent: #ffffff;
        --nav-bg: rgba(238, 242, 243, 0.62);
        --drawer-bg: rgba(238, 242, 243, 0.97);
        --border: rgba(35, 55, 79, 0.2);
        --glow: rgba(35, 55, 79, 0.3);
        --shadow: 0 24px 60px -12px rgba(10, 52, 64, 0.25);
      }
      [dir="rtl"] {
        --dir: -1;
      }

      /* =========================================================
   BASE
   ========================================================= */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        scrollbar-color: var(--accent-c) var(--bg);
      }
      html.lock {
        overflow: hidden;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.65;
        overflow-x: hidden;
        transition:
          background 0.4s ease,
          color 0.4s ease;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--accent-c);
        border-radius: 10px;
        border: 2px solid var(--bg);
      }
      ::selection {
        background: var(--accent-c);
        color: var(--on-accent);
      }
      img {
        max-width: 100%;
        display: block;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      :focus-visible {
        outline: 2px solid var(--accent-c);
        outline-offset: 3px;
        border-radius: 6px;
      }
      .ic {
        width: 1em;
        height: 1em;
        flex: none;
        display: inline-block;
        vertical-align: -0.125em;
      }
      .container {
        width: min(1160px, 100% - 48px);
        margin-inline: auto;
      }
      section {
        position: relative;
        padding: 112px 0;
      }
      .alt {
        background: var(--bg-alt);
      }
      [dir="rtl"] .flip {
        transform: scaleX(-1);
      }

      body.has-cursor,
      body.has-cursor * {
        cursor: none !important;
      }

      /* Custom cursor */
      .cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent-c);
        pointer-events: none;
        z-index: 1000;
        opacity: 0;
        transition:
          width 0.25s var(--ease-d),
          height 0.25s var(--ease-d),
          background 0.25s,
          border-color 0.25s,
          opacity 0.3s;
        border: 1px solid transparent;
        mix-blend-mode: normal;
      }
      .cursor.active {
        width: 46px;
        height: 46px;
        background: rgba(var(--accent-rgb), 0.22);
        border-color: var(--accent-c);
        box-shadow: 0 0 24px var(--glow);
      }

      /* Scroll progress */
      .progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        width: 100%;
        transform-origin: 0 50%;
        transform: scaleX(0);
        background: var(--accent-c);
        z-index: 120;
        box-shadow: 0 0 12px var(--glow);
      }
      [dir="rtl"] .progress {
        transform-origin: 100% 50%;
        left: auto;
        right: 0;
      }

      /* Parallax background shapes */
      .bg-shapes {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }
      .shape {
        position: absolute;
        will-change: transform;
        opacity: 0.07;
        border: 2px solid var(--accent-c);
      }
      .shape.s1 {
        width: 340px;
        height: 340px;
        border-radius: 50%;
        top: 8%;
        left: -110px;
      }
      .shape.s2 {
        width: 200px;
        height: 200px;
        border-radius: 28px;
        top: 42%;
        right: -60px;
        transform: rotate(18deg);
      }
      .shape.s3 {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        top: 70%;
        left: 12%;
        background: var(--accent-c);
        border: 0;
        opacity: 0.05;
      }
      .shape.s4 {
        width: 260px;
        height: 260px;
        border-radius: 40px;
        top: 92%;
        right: 14%;
        transform: rotate(-12deg);
      }
      .shape.s5 {
        width: 70px;
        height: 70px;
        border-radius: 12px;
        top: 26%;
        right: 30%;
        opacity: 0.09;
      }

      /* =========================================================
   NAVBAR
   ========================================================= */
      .nav {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 100;
        height: var(--nav-h);
        display: flex;
        align-items: center;
        background: var(--nav-bg);
        backdrop-filter: blur(16px) saturate(150%);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        border-bottom: 1px solid transparent;
        transition:
          height 0.3s ease,
          border-color 0.3s,
          box-shadow 0.3s,
          background 0.4s;
      }
      .nav.scrolled {
        height: 62px;
        border-color: var(--border);
        box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.4);
      }
      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: 0.3px;
      }
      .logo b {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--accent-c);
        color: var(--on-accent);
        font-size: 0.95rem;
        transition: transform 0.4s var(--bounce);
      }
      .logo:hover b {
        transform: rotate(-8deg) scale(1.1);
      }
      .links {
        display: flex;
        gap: 6px;
      }
      .links a,
      .drawer a.dl {
        position: relative;
        display: block;
        padding: 8px 14px;
        font-weight: 500;
        font-size: 0.95rem;
        color: var(--text-2);
        transition: color 0.3s;
      }
      .links a::after {
        content: "";
        position: absolute;
        inset-inline: 14px;
        bottom: 2px;
        height: 2px;
        border-radius: 2px;
        background: var(--accent-c);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.4s var(--ease-d);
      }
      [dir="rtl"] .links a::after {
        transform-origin: right;
      }
      .links a:hover,
      .links a.active {
        color: var(--text);
      }
      .links a:hover::after,
      .links a.active::after {
        transform: scaleX(1);
      }
      .nav-tools {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tool {
        display: grid;
        place-items: center;
        min-width: 40px;
        height: 40px;
        padding: 0 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(var(--accent-rgb), 0.08);
        font-weight: 700;
        font-size: 0.85rem;
        transition:
          transform 0.3s var(--bounce),
          background 0.3s,
          box-shadow 0.3s,
          border-color 0.3s;
      }
      .tool:hover {
        transform: translateY(-2px);
        background: rgba(var(--accent-rgb), 0.18);
        border-color: var(--accent-c);
        box-shadow: 0 8px 22px -6px var(--glow);
      }
      .tool .ic {
        font-size: 1.1rem;
      }
      .theme-btn .sun {
        display: none;
      }
      [data-theme="light"] .theme-btn .sun {
        display: inline-block;
      }
      [data-theme="light"] .theme-btn .moon {
        display: none;
      }
      .burger {
        display: none;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        border: 1px solid var(--border);
        position: relative;
        background: rgba(var(--accent-rgb), 0.08);
      }
      .burger span {
        position: absolute;
        inset-inline: 11px;
        height: 2px;
        border-radius: 2px;
        background: var(--text);
        transition:
          transform 0.4s var(--ease-d),
          opacity 0.25s,
          top 0.4s var(--ease-d);
      }
      .burger span:nth-child(1) {
        top: 14px;
      }
      .burger span:nth-child(2) {
        top: 20px;
      }
      .burger span:nth-child(3) {
        top: 26px;
      }
      .burger.open span:nth-child(1) {
        top: 20px;
        transform: rotate(45deg);
      }
      .burger.open span:nth-child(2) {
        opacity: 0;
        transform: scaleX(0);
      }
      .burger.open span:nth-child(3) {
        top: 20px;
        transform: rotate(-45deg);
      }

      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(4, 20, 26, 0.6);
        backdrop-filter: blur(3px);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.4s,
          visibility 0s 0.4s;
        z-index: 98;
      }
      .scrim.open {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s;
      }
      .drawer {
        position: fixed;
        top: 0;
        bottom: 0;
        inset-inline-end: 0;
        width: min(320px, 82vw);
        padding: 96px 28px 32px;
        background: var(--drawer-bg);
        backdrop-filter: blur(18px);
        border-inline-start: 1px solid var(--border);
        transform: translateX(calc(100% * var(--dir)));
        transition: transform 0.55s var(--ease-d);
        z-index: 99;
        display: none;
        flex-direction: column;
        gap: 6px;
      }
      .drawer a.dl {
        font-size: 1.25rem;
        font-weight: 600;
        padding: 12px 6px;
        color: var(--text);
        opacity: 0;
        transform: translateX(calc(30px * var(--dir)));
        transition:
          opacity 0.4s,
          transform 0.5s var(--ease-d),
          color 0.3s;
      }
      .drawer.open {
        transform: none;
      }
      .drawer.open a.dl {
        opacity: 1;
        transform: none;
        transition-delay: calc(var(--i) * 0.07s + 0.18s);
      }
      .drawer a.dl.active {
        color: var(--accent-c);
      }

      /* =========================================================
   REVEAL / LOAD ANIMATIONS
   ========================================================= */
      .load {
        opacity: 0;
        transform: translateY(32px);
        animation: loadIn 0.9s var(--ease-d) forwards;
        animation-delay: calc(var(--i, 0) * 0.12s + 0.15s);
      }
      @keyframes loadIn {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .reveal {
        opacity: 0;
        transform: translateY(36px);
        transition:
          opacity 0.8s ease,
          transform 0.9s var(--ease-d);
        transition-delay: var(--d, 0s);
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }

      .sec-head {
        margin-bottom: 56px;
        max-width: 720px;
      }
      .kicker {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent-c);
        margin-bottom: 10px;
      }
      [dir="rtl"] .kicker {
        letter-spacing: 0;
      }
      .sec-head h2 {
        font-size: clamp(1.9rem, 4vw, 2.8rem);
        line-height: 1.2;
        font-weight: 800;
      }
      .sec-head p {
        margin-top: 14px;
        color: var(--text-2);
        font-size: 1.05rem;
      }
      .deco {
        height: 4px;
        width: 0;
        border-radius: 4px;
        margin-top: 18px;
        background: linear-gradient(90deg, var(--accent-c), transparent);
        transition: width 1s var(--ease-d) 0.3s;
      }
      [dir="rtl"] .deco {
        background: linear-gradient(270deg, var(--accent-c), transparent);
      }
      .in .deco {
        width: 90px;
      }

      /* =========================================================
   BUTTONS
   ========================================================= */
      .btn {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 28px;
        border-radius: 999px;
        font-weight: 600;
        border: 1px solid var(--accent-c);
        transition:
          transform 0.25s ease-out,
          box-shadow 0.3s,
          background 0.3s,
          color 0.3s;
        will-change: transform;
      }
      .btn-primary {
        background: var(--accent-c);
        color: var(--on-accent);
      }
      .btn-primary:hover {
        box-shadow: 0 12px 34px -6px var(--glow);
      }
      .btn-ghost {
        color: var(--accent-c);
      }
      .btn-ghost:hover {
        background: rgba(var(--accent-rgb), 0.12);
        box-shadow: 0 0 32px -4px var(--glow);
      }
      .ripple {
        position: absolute;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.35;
        transform: scale(0);
        pointer-events: none;
        animation: ripple 0.65s ease-out forwards;
      }
      @keyframes ripple {
        to {
          transform: scale(1);
          opacity: 0;
        }
      }

      /* Tooltips */
      [data-tip] {
        position: relative;
      }
      [data-tip]::before {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 12px);
        inset-inline-start: 50%;
        transform: translate(-50%, 8px);
        padding: 5px 11px;
        border-radius: 8px;
        white-space: nowrap;
        font-size: 0.75rem;
        font-weight: 600;
        background: var(--accent-c);
        color: var(--on-accent);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s,
          transform 0.3s var(--bounce);
        z-index: 5;
      }
      [dir="rtl"] [data-tip]::before {
        transform: translate(50%, 8px);
      }
      [data-tip]:hover::before,
      [data-tip]:focus-visible::before {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      [dir="rtl"] [data-tip]:hover::before,
      [dir="rtl"] [data-tip]:focus-visible::before {
        transform: translate(50%, 0);
      }

      /* =========================================================
   HERO
   ========================================================= */
      .hero {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        padding: calc(var(--nav-h) + 40px) 0 80px;
        overflow: hidden;
      }
      #constellation {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            60% 55% at 78% 45%,
            rgba(var(--accent-rgb), 0.13),
            transparent 70%
          ),
          radial-gradient(
            40% 40% at 8% 90%,
            rgba(var(--accent-rgb), 0.08),
            transparent 70%
          );
        animation: mesh 14s ease-in-out infinite alternate;
        z-index: 0;
      }
      @keyframes mesh {
        from {
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          transform: translate3d(-2%, 3%, 0) scale(1.08);
        }
      }
      .hero-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 56px;
        align-items: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 16px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid rgba(74, 222, 128, 0.4);
        background: rgba(74, 222, 128, 0.09);
        color: var(--text);
      }
      .dot {
        position: relative;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--success);
      }
      .dot::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--success);
        animation: ping 1.8s ease-out infinite;
      }
      @keyframes ping {
        0% {
          transform: scale(1);
          opacity: 0.7;
        }
        100% {
          transform: scale(3.2);
          opacity: 0;
        }
      }
      .hello {
        margin-top: 26px;
        font-size: 1.15rem;
        color: var(--text-2);
        font-weight: 500;
      }
      .name {
        font-size: clamp(2.6rem, 6.4vw, 4.9rem);
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-top: 4px;
        background: linear-gradient(
          110deg,
          var(--text) 10%,
          var(--accent-c) 45%,
          var(--text) 80%
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation:
          loadIn 0.9s var(--ease-d) forwards,
          sheen 7s linear 1s infinite;
        animation-delay: calc(var(--i, 0) * 0.12s + 0.15s), 0s;
      }
      [dir="rtl"] .name {
        letter-spacing: 0;
      }
      @keyframes sheen {
        to {
          background-position: -220% 0;
        }
      }
      .role {
        margin-top: 10px;
        font-size: clamp(1.25rem, 2.8vw, 1.8rem);
        font-weight: 600;
        color: var(--accent-c);
        min-height: 1.5em;
      }
      .caret {
        display: inline-block;
        width: 3px;
        height: 1.1em;
        margin-inline-start: 4px;
        vertical-align: -0.15em;
        background: var(--accent-c);
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .tagline {
        margin-top: 18px;
        max-width: 540px;
        color: var(--text-2);
        font-size: 1.08rem;
      }
      .cta {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 34px;
      }
      .socials {
        display: flex;
        gap: 12px;
        margin-top: 34px;
      }
      .social {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        font-size: 1.2rem;
        border: 1px solid var(--border);
        background: rgba(var(--accent-rgb), 0.08);
        color: var(--accent-c);
        transition:
          transform 0.35s var(--bounce),
          box-shadow 0.3s,
          background 0.3s,
          color 0.3s,
          border-color 0.3s;
      }
      .social:hover {
        transform: scale(1.18) translateY(-3px);
        background: var(--accent-c);
        color: var(--on-accent);
        border-color: var(--accent-c);
        box-shadow: 0 0 28px var(--glow);
      }

      .hero-visual {
        display: grid;
        place-items: center;
      }
      .float {
        --av: clamp(230px, 31vw, 390px);
        position: relative;
        width: var(--av);
        height: var(--av);
        animation: floaty 6s ease-in-out infinite;
      }
      @keyframes floaty {
        0%,
        100% {
          transform: translateY(-10px);
        }
        50% {
          transform: translateY(12px);
        }
      }
      .orbit {
        position: absolute;
        inset: -26px;
        border-radius: 50%;
        border: 1.5px dashed rgba(var(--accent-rgb), 0.35);
        animation: spin 40s linear infinite;
      }
      .orbit::before {
        content: "";
        position: absolute;
        top: 10%;
        left: 12%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent-c);
        box-shadow: 0 0 16px var(--glow);
      }
      .orbit.o2 {
        inset: -56px;
        border-style: solid;
        border-color: rgba(var(--accent-rgb), 0.12);
        animation-duration: 70s;
        animation-direction: reverse;
      }
      .orbit.o2::before {
        top: auto;
        left: auto;
        bottom: 14%;
        right: 8%;
        width: 8px;
        height: 8px;
        opacity: 0.7;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .avatar {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid var(--accent-c);
        background: var(--surface);
        animation: pulse 3.2s ease-in-out infinite;
        transition:
          transform 0.45s var(--ease-d),
          box-shadow 0.45s;
      }
      .avatar::before {
        content: "BM";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(3rem, 9vw, 6rem);
        font-weight: 800;
        color: var(--accent-c);
        opacity: 0.55;
      }
      .avatar img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 22%;
      }
      .avatar:hover {
        transform: scale(1.05);
        animation-play-state: paused;
        box-shadow:
          0 0 0 10px rgba(var(--accent-rgb), 0.12),
          0 0 90px rgba(var(--accent-rgb), 0.6);
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow:
            0 0 0 0 rgba(var(--accent-rgb), 0.5),
            0 0 34px rgba(var(--accent-rgb), 0.28);
        }
        50% {
          box-shadow:
            0 0 0 22px rgba(var(--accent-rgb), 0),
            0 0 64px rgba(var(--accent-rgb), 0.5);
        }
      }
      .online {
        position: absolute;
        right: 9.5%;
        bottom: 9.5%;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--success);
        border: 4px solid var(--bg);
        box-shadow: 0 0 14px rgba(74, 222, 128, 0.7);
        z-index: 2;
      }
      .online::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid var(--success);
        animation: ping 2s ease-out infinite;
      }
      .scroll-hint {
        position: absolute;
        bottom: 26px;
        inset-inline-start: 50%;
        transform: translateX(-50%);
        z-index: 1;
        width: 26px;
        height: 42px;
        border-radius: 16px;
        border: 2px solid rgba(var(--accent-rgb), 0.5);
      }
      [dir="rtl"] .scroll-hint {
        transform: translateX(50%);
      }
      .scroll-hint::after {
        content: "";
        position: absolute;
        top: 8px;
        inset-inline-start: 50%;
        width: 4px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent-c);
        margin-inline-start: -2px;
        animation: wheel 1.8s ease-in-out infinite;
      }
      @keyframes wheel {
        0% {
          opacity: 1;
          transform: translateY(0);
        }
        80%,
        100% {
          opacity: 0;
          transform: translateY(14px);
        }
      }

      /* =========================================================
   ABOUT
   ========================================================= */
      .about-grid {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 64px;
        align-items: start;
      }
      .photo-card {
        position: relative;
        border-radius: var(--radius-modal);
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--surface);
        aspect-ratio: 4/5;
        box-shadow: var(--shadow);
        transition:
          transform 0.25s ease,
          box-shadow 0.4s;
      }
      .photo-card::before {
        content: "BM";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 5rem;
        font-weight: 800;
        color: var(--accent-c);
        opacity: 0.5;
      }
      .photo-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 18%;
      }
      .photo-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(10, 52, 64, 0.75),
          transparent 40%
        );
        pointer-events: none;
      }
      .photo-card:hover {
        box-shadow: 0 30px 80px -20px var(--glow);
      }
      .photo-tag {
        position: absolute;
        z-index: 2;
        bottom: 18px;
        inset-inline: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 14px;
        background: rgba(10, 52, 64, 0.55);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(175, 186, 190, 0.3);
        color: #fff;
        font-weight: 600;
        font-size: 0.92rem;
      }
      .lines {
        font-size: 1.1rem;
        color: var(--text-2);
      }
      .line {
        display: block;
        margin-bottom: 0.7em;
        opacity: 0;
        transform: translateY(20px);
        filter: blur(5px);
        transition:
          opacity 0.7s ease,
          transform 0.8s var(--ease-d),
          filter 0.7s ease;
        transition-delay: calc(var(--i) * 0.14s);
      }
      .lines.in .line {
        opacity: 1;
        transform: none;
        filter: none;
      }
      .lines .line:first-child {
        color: var(--text);
        font-weight: 500;
      }
      .about-blocks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 30px;
      }
      .panel {
        padding: 24px;
        border-radius: var(--radius);
        background: var(--surface-soft);
        border: 1px solid var(--border);
        transition:
          transform 0.4s var(--ease-d),
          box-shadow 0.4s,
          border-color 0.4s;
      }
      .panel:hover {
        transform: translateY(-8px);
        border-color: var(--accent-c);
        box-shadow: 0 22px 50px -18px var(--glow);
      }
      .panel h3 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.82rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent-c);
        margin-bottom: 14px;
      }
      [dir="rtl"] .panel h3 {
        letter-spacing: 0;
        font-size: 0.95rem;
      }
      .panel h4 {
        font-size: 1.08rem;
        font-weight: 700;
        line-height: 1.4;
      }
      .panel p {
        color: var(--text-2);
        font-size: 0.95rem;
        margin-top: 4px;
      }
      .lang-row + .lang-row {
        margin-top: 14px;
      }
      .lang-row div {
        display: flex;
        justify-content: space-between;
        font-size: 0.92rem;
        margin-bottom: 6px;
      }
      .lang-row small {
        color: var(--text-2);
        font-size: 0.85rem;
      }
      .lang-track {
        height: 6px;
        border-radius: 6px;
        background: rgba(var(--accent-rgb), 0.15);
        overflow: hidden;
      }
      .lang-fill {
        height: 100%;
        width: 0;
        border-radius: 6px;
        background: linear-gradient(
          90deg,
          rgba(var(--accent-rgb), 0.55),
          var(--accent-c)
        );
        transition: width 1.4s var(--ease-d) 0.3s;
      }
      .in .lang-fill {
        width: var(--v);
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .pill {
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        background: rgba(var(--accent-rgb), 0.12);
        border: 1px solid rgba(var(--accent-rgb), 0.35);
        transform: translate(var(--tx, 0), var(--ty, 0))
          rotate(var(--rot, 0deg)) scale(var(--s, 1));
        transition:
          transform 0.5s var(--bounce),
          background 0.3s,
          box-shadow 0.3s;
      }
      .pill:hover {
        background: var(--accent-c);
        color: var(--on-accent);
        box-shadow: 0 8px 24px -6px var(--glow);
      }
      .span-2 {
        grid-column: 1/-1;
      }

      /* =========================================================
   SKILLS
   ========================================================= */
      .tech-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 44px;
      }
      .tech {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 16px;
        font-weight: 800;
        font-size: 0.95rem;
        color: var(--accent-c);
        background: var(--surface-soft);
        border: 1px solid var(--border);
        transition:
          transform 0.4s var(--bounce),
          box-shadow 0.3s,
          background 0.3s,
          color 0.3s;
      }
      .tech:hover {
        transform: translateY(-8px) rotate(-4deg);
        background: var(--accent-c);
        color: var(--on-accent);
        box-shadow: 0 14px 30px -8px var(--glow);
      }
      .skill-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }
      .skill-card {
        position: relative;
        height: 100%;
        padding: 30px;
        border-radius: var(--radius);
        background: var(--surface-soft);
        border: 1px solid var(--border);
        transform-style: preserve-3d;
        transition:
          transform 0.2s ease-out,
          box-shadow 0.4s,
          border-color 0.4s;
      }
      .skill-card:hover {
        border-color: var(--accent-c);
        box-shadow: 0 26px 60px -22px var(--glow);
      }
      .skill-card h3 {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.15rem;
        margin-bottom: 22px;
      }
      .skill-card h3 .ico {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: rgba(var(--accent-rgb), 0.14);
        color: var(--accent-c);
      }
      .badge-xl {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 22px;
        border-radius: 16px;
        background: rgba(var(--accent-rgb), 0.08);
        border: 1px solid rgba(var(--accent-rgb), 0.28);
        font-weight: 700;
        font-size: 1.02rem;
        line-height: 1.5;
        transition:
          transform 0.3s var(--ease-d),
          box-shadow 0.3s,
          border-color 0.3s;
      }
      .badge-xl:hover {
        transform: translateY(-3px);
        border-color: rgba(var(--accent-rgb), 0.55);
        box-shadow: 0 14px 34px -14px var(--glow);
      }
      .badge-xl .badge-ico {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        flex: none;
        border-radius: 14px;
        background: rgba(var(--accent-rgb), 0.15);
        color: var(--accent-c);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .chip {
        padding: 8px 14px;
        border-radius: 12px;
        font-size: 0.88rem;
        font-weight: 600;
        background: rgba(var(--accent-rgb), 0.1);
        border: 1px solid rgba(var(--accent-rgb), 0.3);
        opacity: 0;
        transform: translateY(14px) scale(0.92);
        transition:
          opacity 0.5s,
          transform 0.6s var(--bounce),
          background 0.3s,
          color 0.3s;
        transition-delay: calc(var(--i) * 0.07s + 0.2s);
      }
      .in .chip {
        opacity: 1;
        transform: none;
      }
      .chip:hover {
        background: var(--accent-c);
        color: var(--on-accent);
      }
      /* =========================================================
   PROJECTS — PHONE / LAPTOP FRAMES
   ========================================================= */
      .project-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 40px 36px;
      }
      .project {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 44px 24px 30px;
        border-radius: var(--radius);
        text-align: center;
        cursor: pointer;
        background:
          radial-gradient(
            70% 55% at 50% 30%,
            rgba(var(--accent-rgb), 0.1),
            transparent 75%
          ),
          var(--surface-soft);
        border: 1px solid var(--border);
        opacity: 0;
        transform: translateY(40px);
        transition:
          opacity 0.8s ease,
          transform 0.9s var(--ease-d),
          border-color 0.4s,
          box-shadow 0.4s;
        transition-delay: var(--d, 0s);
      }
      .project.in {
        opacity: 1;
        transform: none;
      }
      .project:hover {
        border-color: rgba(var(--accent-rgb), 0.6);
        box-shadow: 0 30px 70px -30px var(--glow);
      }
      .stage {
        perspective: 1100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 300px;
        justify-content: center;
      }
      .entrance {
        width: 100%;
        display: flex;
        justify-content: center;
        opacity: 0;
        transform: rotateX(38deg) rotateY(-28deg) translateY(70px) scale(0.86);
        transition:
          transform 1.3s var(--ease-d),
          opacity 0.9s ease;
        transition-delay: calc(var(--d, 0s) + 0.15s);
      }
      .project.in .entrance {
        opacity: 1;
        transform: none;
      }

      .phone {
        --w: 240px;
        position: relative;
        direction: ltr;
        width: var(--w);
        aspect-ratio: 9/19;
        padding: 10px;
        border-radius: 40px;
        background: linear-gradient(145deg, #2c4562, #23374f 45%, #1b2c40);
        border: 2px solid rgba(175, 186, 190, 0.5);
        box-shadow:
          inset 0 0 0 2px rgba(0, 0, 0, 0.28),
          0 26px 50px -14px rgba(0, 0, 0, 0.55);
        transform: perspective(900px) rotateX(var(--rx, 0deg))
          rotateY(var(--ry, 0deg));
        transition:
          transform 0.25s ease-out,
          box-shadow 0.5s;
      }
      .phone i {
        position: absolute;
        background: #afbabe;
        opacity: 0.55;
        border-radius: 3px;
      }
      .phone .b1 {
        left: -5px;
        top: 17%;
        width: 3px;
        height: 30px;
      }
      .phone .b2 {
        left: -5px;
        top: 25%;
        width: 3px;
        height: 50px;
      }
      .phone .b3 {
        right: -5px;
        top: 21%;
        width: 3px;
        height: 70px;
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 31px;
        overflow: hidden;
        background: #0a3440;
        isolation: isolate;
      }
      .screen img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        z-index: 1;
      }
      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          125deg,
          rgba(255, 255, 255, 0.12),
          transparent 38%
        );
      }
      .notch {
        position: absolute;
        z-index: 5;
        top: 9px;
        inset-inline-start: 50%;
        transform: translateX(-50%);
        width: 84px;
        height: 23px;
        border-radius: 14px;
        background: #06161c;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
        padding-inline: 8px;
      }
      .notch::before {
        content: "";
        width: 28px;
        height: 4px;
        border-radius: 4px;
        background: #1c2c36;
        margin-inline-end: auto;
      }
      .notch::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #3b5a6b, #0b1a22);
      }
      .ph {
        position: absolute;
        inset: 0;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 26px;
        text-align: center;
        direction: ltr;
        font-size: 0.76rem;
        line-height: 1.5;
        color: rgba(175, 186, 190, 0.88);
        background:
          repeating-linear-gradient(
            45deg,
            rgba(175, 186, 190, 0.06) 0 10px,
            transparent 10px 20px
          ),
          #0a3440;
      }
      .ph code {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.78rem;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(175, 186, 190, 0.14);
        word-break: break-all;
      }
      .has-img .ph {
        display: none;
      }
      .overlay {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        padding: 20px 12px;
        background: linear-gradient(
          to top,
          rgba(10, 52, 64, 0.95),
          rgba(10, 52, 64, 0.45) 55%,
          transparent
        );
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .view-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 0.84rem;
        font-weight: 700;
        background: #afbabe;
        color: #0a3440;
        opacity: 0;
        transform: scale(0.6);
        transition:
          transform 0.55s var(--bounce),
          opacity 0.35s;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .tag-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        transform: translateY(34px);
        opacity: 0;
        transition:
          transform 0.55s var(--ease-d) 0.08s,
          opacity 0.4s 0.08s;
      }
      .tag {
        padding: 4px 11px;
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 600;
        background: rgba(var(--accent-rgb), 0.14);
        border: 1px solid rgba(var(--accent-rgb), 0.38);
      }
      .overlay .tag {
        color: #fff;
        background: rgba(175, 186, 190, 0.16);
        border-color: rgba(175, 186, 190, 0.42);
      }
      .project:hover .overlay,
      .project:focus-visible .overlay {
        opacity: 1;
      }
      .project:hover .view-btn,
      .project:focus-visible .view-btn {
        opacity: 1;
        transform: scale(1);
      }
      .project:hover .tag-row,
      .project:focus-visible .tag-row {
        opacity: 1;
        transform: none;
      }
      .project:hover .phone,
      .project:hover .laptop .lid {
        box-shadow:
          inset 0 0 0 2px rgba(0, 0, 0, 0.28),
          0 0 0 1px var(--accent-base),
          0 0 46px rgba(175, 186, 190, 0.5),
          0 34px 60px -14px rgba(0, 0, 0, 0.6);
      }
      .ground {
        width: 68%;
        height: 20px;
        margin-top: 20px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.55),
          transparent 70%
        );
        filter: blur(7px);
        opacity: 0.55;
        transition:
          transform 0.6s var(--ease-d),
          opacity 0.5s;
      }
      [data-theme="light"] .ground {
        background: radial-gradient(
          ellipse at center,
          rgba(10, 52, 64, 0.5),
          transparent 70%
        );
      }
      .project:hover .ground {
        transform: scale(1.35, 1.5);
        opacity: 0.95;
      }
      @media (hover: none) {
        .view-btn {
          opacity: 1;
          transform: none;
        }
        .overlay {
          opacity: 1;
          background: linear-gradient(
            to top,
            rgba(10, 52, 64, 0.8),
            transparent 38%
          );
        }
        .overlay .tag-row {
          display: none;
        }
      }

      .laptop {
        --w: min(100%, 430px);
        direction: ltr;
        width: var(--w);
        transform: perspective(900px) rotateX(var(--rx, 0deg))
          rotateY(var(--ry, 0deg));
        transition: transform 0.25s ease-out;
      }
      .laptop .lid {
        position: relative;
        padding: 20px 14px 14px;
        border-radius: 16px 16px 6px 6px;
        background: linear-gradient(150deg, #2c4562, #23374f 50%, #1b2c40);
        border: 2px solid rgba(175, 186, 190, 0.5);
        box-shadow:
          inset 0 0 0 2px rgba(0, 0, 0, 0.25),
          0 26px 50px -14px rgba(0, 0, 0, 0.55);
        transition: box-shadow 0.5s;
      }
      .laptop .cam {
        position: absolute;
        top: 7px;
        left: 50%;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #3b5a6b, #0b1a22);
      }
      .laptop .screen {
        aspect-ratio: 16/10;
        border-radius: 6px;
      }
      .laptop .screen img {
        object-position: center;
      }
      .lbase {
        position: relative;
        width: 114%;
        margin-left: -7%;
        height: 15px;
        border-radius: 2px 2px 18px 18px;
        background: linear-gradient(#34506e, #23374f 60%, #1b2c40);
        border: 1px solid rgba(175, 186, 190, 0.4);
        border-top: 0;
        box-shadow: 0 14px 24px -10px rgba(0, 0, 0, 0.5);
      }
      .lbase::after {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 18%;
        height: 5px;
        margin-left: -9%;
        border-radius: 0 0 8px 8px;
        background: #0e1f2b;
      }
      .project-info {
        margin-top: 26px;
      }
      .project-info h3 {
        font-size: 1.4rem;
        font-weight: 800;
        line-height: 1.3;
      }
      .project-info .sub {
        display: block;
        margin-top: 3px;
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--accent-c);
      }
      .project-info p {
        margin-top: 10px;
        color: var(--text-2);
        font-size: 0.97rem;
        max-width: 420px;
        margin-inline: auto;
      }

      /* =========================================================
   MODAL
   ========================================================= */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(4, 20, 26, 0.84);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.4s ease,
          visibility 0s 0.4s;
      }
      .modal.open {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease;
      }
      .dialog {
        position: relative;
        width: min(1100px, 100%);
        max-height: calc(100vh - 40px);
        max-height: calc(100dvh - 40px);
        overflow: auto;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        border-radius: var(--radius-modal);
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: 0 40px 120px -20px rgba(0, 0, 0, 0.7);
        transform: translateY(110px) scale(0.94);
        opacity: 0;
        transition:
          transform 0.8s var(--bounce),
          opacity 0.4s ease;
        scrollbar-width: thin;
      }
      .modal.open .dialog {
        transform: none;
        opacity: 1;
      }
      .m-close {
        position: fixed;
        top: 20px;
        inset-inline-end: 22px;
        z-index: 5;
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        font-size: 1.3rem;
        background: var(--accent-c);
        color: var(--on-accent);
        transform: rotate(-200deg) scale(0);
        opacity: 0;
        transition:
          transform 0.7s var(--bounce) 0.2s,
          opacity 0.3s 0.2s,
          box-shadow 0.3s;
      }
      .modal.open .m-close {
        transform: none;
        opacity: 1;
      }
      .m-close:hover {
        box-shadow: 0 0 30px var(--glow);
        transform: rotate(90deg) scale(1.08);
        transition-delay: 0s;
        transition-duration: 0.35s;
      }
      .m-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 50px 64px 36px;
        background:
          radial-gradient(
            60% 55% at 50% 42%,
            rgba(var(--accent-rgb), 0.18),
            transparent 70%
          ),
          var(--bg);
        min-height: 560px;
      }
      .m-device {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .m-device .phone {
        --w: min(290px, 60vw);
      }
      .m-device .laptop {
        --w: min(100%, 520px);
      }
      .m-device .phone,
      .m-device .laptop {
        transform: none;
      }
      .car {
        position: absolute;
        inset: 0;
        z-index: 3;
        overflow: hidden;
        touch-action: pan-y;
        cursor: grab;
        -webkit-user-select: none;
        user-select: none;
      }
      .car.dragging {
        cursor: grabbing;
      }
      .track {
        display: flex;
        height: 100%;
        direction: ltr;
        transition: transform 0.6s var(--ease-d);
      }
      .slide {
        position: relative;
        flex: 0 0 100%;
        height: 100%;
        opacity: 0.25;
        transform: scale(0.96);
        transition:
          opacity 0.6s ease,
          transform 0.6s var(--ease-d);
      }
      .slide.active {
        opacity: 1;
        transform: none;
      }
      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        pointer-events: none;
        -webkit-user-drag: none;
      }
      .laptop .slide img {
        object-position: center;
      }
      .slide .ph {
        display: flex;
      }
      .arrow {
        position: absolute;
        top: 50%;
        z-index: 4;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        margin-top: -48px;
        border-radius: 50%;
        font-size: 1.2rem;
        border: 1px solid var(--border);
        background: rgba(var(--accent-rgb), 0.1);
        color: var(--text);
        transition:
          box-shadow 0.3s,
          background 0.3s,
          color 0.3s,
          transform 0.3s var(--bounce),
          opacity 0.3s;
      }
      .arrow:hover {
        background: var(--accent-c);
        color: var(--on-accent);
        box-shadow: 0 0 30px var(--glow);
        transform: scale(1.12);
      }
      .arrow.prev {
        left: 14px;
      }
      .arrow.next {
        right: 14px;
      }
      .arrow[hidden] {
        display: none;
      }
      .arrow:disabled {
        opacity: 0.3;
        pointer-events: none;
      }
      .dots {
        display: flex;
        gap: 10px;
        min-height: 10px;
      }
      .dots button {
        width: 10px;
        height: 10px;
        border-radius: 10px;
        background: rgba(var(--accent-rgb), 0.3);
        transition:
          width 0.4s var(--ease-d),
          background 0.3s;
      }
      .dots button:hover {
        background: rgba(var(--accent-rgb), 0.65);
      }
      .dots button.active {
        width: 30px;
        background: var(--accent-c);
      }
      .m-info {
        padding: 56px 48px 44px;
        display: flex;
        flex-direction: column;
      }
      .m-info .kicker {
        margin-bottom: 8px;
      }
      .m-info h3 {
        font-size: clamp(1.6rem, 3vw, 2.1rem);
        font-weight: 800;
        line-height: 1.2;
      }
      .m-info .sub {
        margin-top: 6px;
        font-weight: 600;
        color: var(--accent-c);
      }
      .m-info .desc {
        margin-top: 16px;
        color: var(--text-2);
      }
      .m-info h4 {
        margin: 26px 0 12px;
        font-size: 0.78rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--accent-c);
      }
      [dir="rtl"] .m-info h4 {
        letter-spacing: 0;
        font-size: 0.95rem;
      }
      .feat {
        display: grid;
        gap: 9px;
      }
      .feat li {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        font-size: 0.97rem;
        opacity: 0;
        animation: fadeUp 0.55s var(--ease-d) both;
        animation-delay: calc(var(--i) * 0.06s + 0.45s);
      }
      .feat .ic {
        margin-top: 0.28em;
        color: var(--success);
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .m-count {
        margin-top: auto;
        padding-top: 26px;
        color: var(--text-2);
        font-size: 0.88rem;
        font-variant-numeric: tabular-nums;
      }

      /* =========================================================
   CONTACT
   ========================================================= */
      .contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        align-items: start;
      }
      .c-list {
        display: grid;
        gap: 16px;
      }
      .c-card {
        display: flex;
        align-items: center;
        gap: 6px;
        border-radius: var(--radius);
        background: var(--surface-soft);
        border: 1px solid var(--border);
        transform-style: preserve-3d;
        transition:
          transform 0.2s ease-out,
          box-shadow 0.4s,
          border-color 0.4s;
      }
      .c-card:hover {
        border-color: var(--accent-c);
        box-shadow: 0 22px 50px -18px var(--glow);
      }
      .c-main {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        min-width: 0;
      }
      .c-ic {
        display: grid;
        place-items: center;
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        font-size: 1.3rem;
        color: var(--accent-c);
        background: rgba(var(--accent-rgb), 0.14);
        transition:
          background 0.3s,
          color 0.3s;
      }
      .c-card:hover .c-ic {
        background: var(--accent-c);
        color: var(--on-accent);
      }
      .c-card:hover .c-ic .ic {
        animation: bounce 0.7s var(--ease-d);
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-9px);
        }
        55% {
          transform: translateY(0);
        }
        75% {
          transform: translateY(-4px);
        }
      }
      .c-txt {
        min-width: 0;
      }
      .c-txt small {
        display: block;
        color: var(--text-2);
        font-size: 0.8rem;
      }
      .c-txt b {
        display: block;
        font-size: 1rem;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-act {
        display: grid;
        place-items: center;
        flex: none;
        width: 42px;
        height: 42px;
        margin-inline-end: 14px;
        border-radius: 12px;
        font-size: 1.05rem;
        color: var(--accent-c);
        border: 1px solid var(--border);
        transition:
          background 0.3s,
          color 0.3s,
          transform 0.3s var(--bounce);
      }
      .c-act:hover {
        background: var(--accent-c);
        color: var(--on-accent);
        transform: scale(1.1);
      }
      .c-act.done {
        background: var(--success);
        color: #0a3440;
        border-color: var(--success);
      }
      .form {
        padding: 34px;
        border-radius: var(--radius);
        background: var(--surface-soft);
        border: 1px solid var(--border);
      }
      .form h3 {
        font-size: 1.35rem;
        margin-bottom: 22px;
      }
      .field {
        position: relative;
        margin-bottom: 20px;
      }
      .field input,
      .field textarea {
        width: 100%;
        padding: 22px 16px 9px;
        font: inherit;
        color: var(--text);
        background: rgba(var(--accent-rgb), 0.07);
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: 0;
        resize: vertical;
        transition:
          border-color 0.3s,
          box-shadow 0.3s,
          background 0.3s;
      }
      .field textarea {
        min-height: 130px;
      }
      .field label {
        position: absolute;
        top: 16px;
        inset-inline-start: 16px;
        color: var(--text-2);
        pointer-events: none;
        transform-origin: left top;
        transition:
          transform 0.3s var(--ease-d),
          color 0.3s;
      }
      [dir="rtl"] .field label {
        transform-origin: right top;
      }
      .field input:focus,
      .field textarea:focus {
        border-color: var(--accent-c);
        background: rgba(var(--accent-rgb), 0.11);
        box-shadow:
          0 0 0 4px rgba(var(--accent-rgb), 0.18),
          0 0 30px -6px var(--glow);
      }
      .field input:focus + label,
      .field textarea:focus + label,
      .field input:not(:placeholder-shown) + label,
      .field textarea:not(:placeholder-shown) + label {
        transform: translateY(-10px) scale(0.78);
        color: var(--accent-c);
      }
      .form .btn {
        width: 100%;
      }

      /* =========================================================
   FOOTER + BACK TO TOP + TOAST
   ========================================================= */
      footer {
        position: relative;
        margin-top: 0;
        padding: 0 0 34px;
        background: var(--bg-alt);
        overflow: hidden;
      }
      .waves {
        position: relative;
        height: 70px;
        margin-bottom: 26px;
        overflow: hidden;
      }
      .waves svg {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 200%;
        height: 100%;
        fill: rgba(var(--accent-rgb), 0.14);
        animation: wave 14s linear infinite;
      }
      .waves svg + svg {
        height: 80%;
        fill: rgba(var(--accent-rgb), 0.09);
        animation-duration: 22s;
        animation-direction: reverse;
      }
      @keyframes wave {
        to {
          transform: translateX(-50%);
        }
      }
      .foot {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: space-between;
        align-items: center;
        color: var(--text-2);
        font-size: 0.92rem;
      }
      .to-top {
        position: fixed;
        bottom: 26px;
        inset-inline-end: 26px;
        z-index: 90;
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        font-size: 1.5rem;
        background: var(--accent-c);
        color: var(--on-accent);
        box-shadow: 0 12px 30px -6px var(--glow);
        opacity: 0;
        visibility: hidden;
        transform: translateY(30px) scale(0.7);
        transition:
          opacity 0.4s,
          transform 0.5s var(--bounce),
          visibility 0s 0.4s,
          box-shadow 0.3s;
      }
      .to-top.show {
        opacity: 1;
        visibility: visible;
        transform: none;
        transition:
          opacity 0.4s,
          transform 0.5s var(--bounce);
      }
      .to-top:hover {
        box-shadow: 0 16px 40px -4px var(--glow);
      }
      .to-top:hover .ic {
        animation: rocketHover 0.6s ease-in-out infinite alternate;
      }
      @keyframes rocketHover {
        to {
          transform: translateY(-4px) rotate(-3deg);
        }
      }
      .to-top.launch .ic {
        animation: launch 0.9s cubic-bezier(0.55, 0, 1, 0.45) forwards;
      }
      @keyframes launch {
        0% {
          transform: translateY(0);
        }
        20% {
          transform: translateY(6px);
        }
        100% {
          transform: translateY(-140px);
          opacity: 0;
        }
      }
      .toast {
        position: fixed;
        bottom: 30px;
        inset-inline-start: 50%;
        transform: translate(-50%, 40px);
        z-index: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 22px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 0.93rem;
        background: var(--accent-c);
        color: var(--on-accent);
        box-shadow: 0 18px 44px -10px rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.35s,
          transform 0.5s var(--bounce);
      }
      [dir="rtl"] .toast {
        transform: translate(50%, 40px);
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      [dir="rtl"] .toast.show {
        transform: translate(50%, 0);
      }

      /* =========================================================
   RESPONSIVE
   ========================================================= */
      @media (max-width: 1024px) {
        .hero-grid {
          gap: 36px;
        }
        .about-grid {
          gap: 40px;
        }
        .project-grid {
          gap: 30px 24px;
        }
        .phone {
          --w: 210px;
        }
        .dialog {
          grid-template-columns: 1fr;
        }
        .m-stage {
          min-height: 0;
          padding: 56px 58px 30px;
        }
      }
      @media (max-width: 860px) {
        .links {
          display: none;
        }
        .burger {
          display: block;
        }
        .drawer {
          display: flex;
        }
        .hero-grid {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .hero-visual {
          order: -1;
        }
        .hero-text {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .cta,
        .socials {
          justify-content: center;
        }
        .about-grid,
        .contact-grid,
        .skill-grid,
        .project-grid {
          grid-template-columns: 1fr;
        }
        .photo-card {
          max-width: 380px;
          margin-inline: auto;
        }
        .float {
          --av: clamp(210px, 58vw, 300px);
        }
        .orbit.o2 {
          display: none;
        }
        section {
          padding: 84px 0;
        }
        .scroll-hint {
          display: none;
        }
      }
      @media (max-width: 560px) {
        .container {
          width: calc(100% - 32px);
        }
        .about-blocks {
          grid-template-columns: 1fr;
        }
        .span-2 {
          grid-column: auto;
        }
        .m-info {
          padding: 30px 24px 30px;
        }
        .m-stage {
          padding: 50px 20px 24px;
        }
        .arrow {
          width: 40px;
          height: 40px;
          margin-top: -40px;
        }
        .arrow.prev {
          left: 4px;
        }
        .arrow.next {
          right: 4px;
        }
        .form {
          padding: 24px;
        }
        .project {
          padding: 36px 14px 26px;
        }
        .shape {
          display: none;
        }
        .foot {
          justify-content: center;
          text-align: center;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          transition-delay: 0s !important;
        }
      }
    </style>
  </head>

        function initNav() {

          const progress = $("#progress"),

          let ticking = false;
          const onScroll = () => {
            ticking = false;
            const y = scrollY;

            const max = document.documentElement.scrollHeight - innerHeight;
            progress.style.transform = `scaleX(${max > 0 ? Math.min(1, y / max) : 0})`;
            toTop.classList.toggle("show", y > 500);
            let current = ids[0];
            secs.forEach((s, i) => {
              if (s && s.getBoundingClientRect().top <= innerHeight * 0.35)
                current = ids[i];
            });
            $$("[data-nav]").forEach((a) =>
              a.classList.toggle("active", a.dataset.nav === current),
            );

            "scroll",
            () => {
              if (!ticking) {
                ticking = true;
                requestAnimationFrame(onScroll);
              }
            },
            { passive: true },
          );

            toTop.classList.add("launch");

            setTimeout(() => toTop.classList.remove("launch"), 1000);

        /* =========================================================

   ========================================================= */
        let typerToken = 0;
        function startTyper() {
          const el = $("#typed");
          const token = ++typerToken;
          const roles = t("hero.roles");
          if (reduceMotion) {
            el.textContent = roles[0];
            return;
          }
          let r = 0,
            c = 0,
            del = false;
          (function tick() {
            if (token !== typerToken) return;
            const w = roles[r];
            c += del ? -1 : 1;
            el.textContent = w.slice(0, c);
            let delay = del ? 38 : 85;
            if (!del && c === w.length) {
              del = true;
              delay = 1700;
            } else if (del && c === 0) {
              del = false;
              r = (r + 1) % roles.length;
              delay = 450;
            }
            setTimeout(tick, delay);
          })();
        }

        /* =========================================================
   HERO CONSTELLATION (canvas)
   ========================================================= */
        function initParticles() {
          const cv = $("#constellation"),
            ctx = cv.getContext("2d");
          let w = 0,
            h = 0,
            pts = [],
            raf = 0,
            visible = true,
            rgb = "175,186,190";
          const mouse = { x: -999, y: -999 };
          const readColor = () => {
            rgb =
              getComputedStyle(document.documentElement)
                .getPropertyValue("--accent-rgb")
                .trim() || rgb;
          };
          const resize = () => {
            const r = cv.parentElement.getBoundingClientRect();
            const dpr = Math.min(devicePixelRatio || 1, 2);
            w = r.width;
            h = r.height;
            cv.width = w * dpr;
            cv.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const n = Math.round(
              Math.min(
                isMobile() ? 28 : 70,
                (w * h) / (isMobile() ? 24000 : 15000),
              ),
            );
            pts = Array.from({ length: n }, () => ({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: (Math.random() - 0.5) * 0.35,
              vy: (Math.random() - 0.5) * 0.35,
              r: Math.random() * 1.6 + 0.8,
            }));
          };
          const frame = () => {
            ctx.clearRect(0, 0, w, h);
            for (let i = 0; i < pts.length; i++) {
              const p = pts[i];
              if (!reduceMotion) {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > w) p.vx *= -1;
                if (p.y < 0 || p.y > h) p.vy *= -1;
              }
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, 6.2832);
              ctx.fillStyle = `rgba(${rgb},.3)`;
              ctx.fill();
              for (let j = i + 1; j < pts.length; j++) {
                const q = pts[j],
                  dx = p.x - q.x,
                  dy = p.y - q.y,
                  d = Math.hypot(dx, dy);
                if (d < 125) {
                  ctx.strokeStyle = `rgba(${rgb},${(0.13 * (1 - d / 125)).toFixed(3)})`;
                  ctx.lineWidth = 1;
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(q.x, q.y);
                  ctx.stroke();
                }
              }
              const mx = p.x - mouse.x,
                my = p.y - mouse.y,
                md = Math.hypot(mx, my);
              if (md < 150) {
                ctx.strokeStyle = `rgba(${rgb},${(0.24 * (1 - md / 150)).toFixed(3)})`;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.stroke();
              }
            }
            if (!reduceMotion && visible) raf = requestAnimationFrame(frame);
          };
          const start = () => {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(frame);
          };
          resize();
          readColor();
          start();
          let rt;
          addEventListener("resize", () => {
            clearTimeout(rt);
            rt = setTimeout(() => {
              resize();
              start();
            }, 200);
          });
          if (finePointer)
            $("#home").addEventListener("mousemove", (e) => {
              const r = cv.getBoundingClientRect();
              mouse.x = e.clientX - r.left;
              mouse.y = e.clientY - r.top;
            });
          $("#home").addEventListener("mouseleave", () => {
            mouse.x = mouse.y = -999;
          });
          if ("IntersectionObserver" in window)
            new IntersectionObserver((es) => {
              visible = es[0].isIntersecting;
              if (visible) start();
            }).observe($("#home"));
          window.__refreshParticles = () => {
            readColor();
            if (reduceMotion) frame();
          };
        }

        /* =========================================================
   REVEAL ON SCROLL + COUNT-UP
   ========================================================= */
        function countUp(el) {
          const to = +el.dataset.to,
            dur = 1500,
            t0 = performance.now();
          if (reduceMotion) {
            el.textContent = to + "%";
            return;
          }
          (function step(now) {
            const p = Math.min(1, (now - t0) / dur),
              e = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(to * e) + "%";
            if (p < 1) requestAnimationFrame(step);
          })(t0);
        }
        let io;
        function observe(root = document) {
          const els = $$(".reveal, .project, .lines", root).filter(
            (e) => !e.classList.contains("in"),
          );
          if (!("IntersectionObserver" in window)) {
            els.forEach((e) => e.classList.add("in"));
            return;
          }
          if (!io)
            io = new IntersectionObserver(
              (entries) => {
                entries.forEach((en) => {
                  if (!en.isIntersecting) return;
                  en.target.classList.add("in");
                  $$(".count", en.target).forEach(countUp);
                  io.unobserve(en.target);
                });
              },
              { threshold: 0.16, rootMargin: "0px 0px -6% 0px" },
            );
          els.forEach((e) => io.observe(e));
        }

        async function loadGallery(p) {

          loadGallery(p).then((list) => {
            if (modalState.project !== p) return;
            const track = $("#track");
            if (!track) return;
            track.innerHTML = list.length
              ? list
                  .map(
                    (src, i) =>
                      `<div class="slide"><!-- IMAGE: ${src} --><img src="${src}" alt="${t("proj." + p.id + ".name")} — ${i + 1}" draggable="false"></div>`,
                  )

        function closeModal() {
          const m = $("#modal");
          m.classList.remove("open");
          m.setAttribute("aria-hidden", "true");
          document.documentElement.classList.remove("lock");
          modalState.project = null;
          if (modalState.trigger)
            modalState.trigger.focus({ preventScroll: true });
        }
        function go(i, instant) {
          const n = modalState.count;
          const track = $("#track");
          if (!track) return;
          if (n < 2) {
            $("#mPrev").hidden = $("#mNext").hidden = true;
            if (n === 1) $$(".slide", track)[0].classList.add("active");
            updateCount();
            return;
          }
          i = Math.max(0, Math.min(n - 1, i));
          modalState.idx = i;
          track.style.transition = instant ? "none" : "";
          track.style.transform = `translateX(${-i * 100}%)`;
          if (instant) {
            void track.offsetWidth;
            track.style.transition = "";
          }
          $$(".slide", track).forEach((s, k) =>
            s.classList.toggle("active", k === i),
          );
          $$("#mDots button").forEach((b, k) =>
            b.classList.toggle("active", k === i),
          );
          $("#mPrev").hidden = $("#mNext").hidden = false;
          $("#mPrev").disabled = i === 0;
          $("#mNext").disabled = i === n - 1;
          updateCount();
        }
        function initCarousel() {
          car = $("#car");
          const track = $("#track");
          if (!car || modalState.count < 2) return;
          let d = null;
          car.addEventListener("pointerdown", (e) => {
            if (e.pointerType === "mouse" && e.button !== 0) return;
            d = { x: e.clientX, dx: 0 };
            car.setPointerCapture(e.pointerId);
            car.classList.add("dragging");
            track.style.transition = "none";
          });
          car.addEventListener("pointermove", (e) => {
            if (!d) return;
            d.dx = e.clientX - d.x;
            track.style.transform = `translateX(calc(${-modalState.idx * 100}% + ${d.dx}px))`;
          });
          const end = () => {
            if (!d) return;
            const th = Math.min(80, car.clientWidth * 0.18);
            const dx = d.dx;
            d = null;
            car.classList.remove("dragging");
            track.style.transition = "";
            if (dx < -th) go(modalState.idx + 1);
            else if (dx > th) go(modalState.idx - 1);
            else go(modalState.idx);
          };
          car.addEventListener("pointerup", end);
          car.addEventListener("pointercancel", end);
        }
        function initModal() {
          $("#mClose").addEventListener("click", closeModal);
          $("#modal").addEventListener("click", (e) => {
            if (e.target.id === "modal") closeModal();
          });
          $("#mPrev").addEventListener("click", () => go(modalState.idx - 1));
          $("#mNext").addEventListener("click", () => go(modalState.idx + 1));
          $("#mDots").addEventListener("click", (e) => {
            const b = e.target.closest("button");
            if (b) go(+b.dataset.i);
          });
          addEventListener("keydown", (e) => {
            if (!$("#modal").classList.contains("open")) return;
            if (e.key === "Escape") closeModal();
            else if (e.key === "ArrowLeft") go(modalState.idx - 1);
            else if (e.key === "ArrowRight") go(modalState.idx + 1);
            else if (e.key === "Tab") {
              const f = $$("button:not([hidden]):not(:disabled)", $("#modal"));
              if (!f.length) return;
              const first = f[0],
                last = f[f.length - 1];
              if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last.focus();
              } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
              }
            }
          });
        }
